<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitScreen Browser Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" data-state="loading">
    <header class="masthead">
      <img src="icons/icon32.png" alt="" class="masthead-logo" width="24" height="24">
      <h1 class="masthead-title" data-i18n="extName">SplitScreen Browser Sync</h1>
      <span class="masthead-version" id="version"></span>
    </header>

    <!-- Status of the active tab's Split View pair. Always visible. -->
    <section class="status" aria-labelledby="statusTitle">
      <div class="status-row">
        <svg class="pair" viewBox="0 0 76 44" aria-hidden="true" focusable="false">
          <rect class="pair-pane" x="1" y="1" width="30" height="42" rx="5"/>
          <rect class="pair-pane" x="45" y="1" width="30" height="42" rx="5"/>
          <g class="pair-lines">
            <rect x="6" y="8" width="16" height="3" rx="1.5"/>
            <rect x="6" y="15" width="20" height="3" rx="1.5"/>
            <rect x="6" y="22" width="12" height="3" rx="1.5"/>
            <rect x="50" y="8" width="16" height="3" rx="1.5"/>
            <rect x="50" y="15" width="20" height="3" rx="1.5"/>
            <rect x="50" y="22" width="12" height="3" rx="1.5"/>
          </g>
          <path class="pair-link" d="M31 22h14"/>
          <circle class="pair-node" cx="38" cy="22" r="4"/>
        </svg>
        <div class="status-text" role="status" aria-live="polite">
          <h2 class="status-title" id="statusTitle"></h2>
          <p class="status-body" id="statusBody"></p>
          <p class="status-meta" id="statusMeta" hidden></p>
        </div>
      </div>

      <button id="syncToggle" type="button" class="btn btn-primary" hidden></button>
    </section>

    <div class="tabs" role="tablist" data-i18n-aria="tabsLabel">
      <button type="button" class="tab" role="tab" id="tab-sync" aria-controls="panel-sync" data-tab="sync" data-i18n="tabSync"></button>
      <button type="button" class="tab" role="tab" id="tab-checklist" aria-controls="panel-checklist" data-tab="checklist" data-i18n="tabChecklist"></button>
      <button type="button" class="tab" role="tab" id="tab-compare" aria-controls="panel-compare" data-tab="compare" data-i18n="tabCompare"></button>
      <button type="button" class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" data-tab="settings" data-i18n="tabSettings"></button>
    </div>

    <div class="panels">
      <!-- Sync: options for the current pair. -->
      <section class="panel" role="tabpanel" id="panel-sync" aria-labelledby="tab-sync" tabindex="0">
        <ol class="steps" id="emptySteps" hidden>
          <li data-i18n="emptyStep1"></li>
          <li data-i18n="emptyStep2"></li>
          <li data-i18n="emptyStep3"></li>
        </ol>

        <div class="group" id="currentGroup" hidden>
          <div class="group-head">
            <h2 class="group-title" id="currentGroupTitle" data-i18n="sectionThisSplit"></h2>
            <p class="group-help" data-i18n="sectionThisSplitHelp"></p>
          </div>

          <div class="options">
            <label class="option option-stack">
              <span class="option-text">
                <span class="option-label" data-i18n="optAlign"></span>
                <span class="option-help" data-i18n="optAlignHelp"></span>
              </span>
              <select class="select" data-group-choice="alignMode">
                <option value="pixel" data-i18n="alignPixel"></option>
                <option value="element" data-i18n="alignElement"></option>
              </select>
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optNavigation"></span>
                <span class="option-help" data-i18n="optNavigationHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="syncNavigation">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optClicks"></span>
                <span class="option-help" data-i18n="optClicksHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="mirrorClicks">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optHover"></span>
                <span class="option-help" data-i18n="optHoverHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="mirrorHover">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optCursor"></span>
                <span class="option-help" data-i18n="optCursorHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="showCursor">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optContainers"></span>
                <span class="option-help" data-i18n="optContainersHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="syncContainers">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optZoom"></span>
                <span class="option-help" data-i18n="optZoomHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="syncZoom">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optInput"></span>
                <span class="option-help" data-i18n="optInputHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="syncInput">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optWpAdminBar"></span>
                <span class="option-help" data-i18n="optWpAdminBarHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="hideWpAdminBar">
            </label>
          </div>

          <div class="actions">
            <button id="addRuler" type="button" class="btn btn-secondary">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 8h12M8 4v8" /></svg>
              <span data-i18n="btnAddRuler"></span>
            </button>
            <button id="showCurrent" type="button" class="btn btn-secondary"></button>
          </div>
        </div>

        <div class="group" id="historyGroup">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionHistory"></h2>
            <p class="group-help" data-i18n="historyHelp"></p>
          </div>
          <ul class="history" id="historyList"></ul>
          <p class="empty-hint" id="historyEmpty" data-i18n="historyEmpty"></p>
          <p class="result-line" id="historyResult" role="status" aria-live="polite"></p>
        </div>
      </section>

      <!-- Checklist: pages to check on both sites. -->
      <section class="panel" role="tabpanel" id="panel-checklist" aria-labelledby="tab-checklist" tabindex="0" hidden>
        <p class="empty-hint" data-need-pair-hint data-i18n="needPairHint"></p>

        <div class="group" id="checklistGroup" data-needs-pair>
          <div class="group-head">
            <p class="group-help" data-i18n="checklistHelp"></p>
            <p class="origins" id="checklistOrigins"></p>
          </div>

          <div class="progress" id="checklistProgressWrap" hidden>
            <div class="progress-text"><span id="checklistProgress"></span><span id="checklistFails" class="fails"></span></div>
            <div class="progress-bar" role="progressbar" id="checklistBar" aria-valuemin="0"><span id="checklistBarFill"></span></div>
          </div>

          <div class="current" id="checklistCurrent" hidden>
            <div class="current-head">
              <span class="current-pos" id="checklistPos"></span>
              <div class="nav-buttons">
                <button type="button" class="btn btn-secondary btn-small" id="checklistPrev" data-i18n="btnPrev"></button>
                <button type="button" class="btn btn-primary btn-small" id="checklistNext" data-i18n="btnNext"></button>
              </div>
            </div>
            <p class="current-path" id="checklistPath"></p>
            <p class="empty-hint" id="checklistHint"></p>
            <div class="status-buttons" role="group" data-i18n-aria="checklistStatusLabel" id="checklistStatus">
              <button type="button" class="chip chip-ok" data-status="ok" aria-pressed="false" data-i18n="statusOk"></button>
              <button type="button" class="chip chip-fail" data-status="fail" aria-pressed="false" data-i18n="statusFail"></button>
              <button type="button" class="chip chip-na" data-status="na" aria-pressed="false" data-i18n="statusNa"></button>
            </div>
            <label class="field">
              <span class="field-label" data-i18n="checklistNote"></span>
              <textarea id="checklistNote" rows="2" maxlength="1000" data-i18n-placeholder="checklistNotePlaceholder"></textarea>
            </label>
          </div>

          <p class="empty-hint" id="checklistEmpty" data-i18n="checklistEmpty"></p>

          <details class="list-details" id="checklistListWrap" hidden>
            <summary class="group-summary"><span class="group-title" data-i18n="checklistAllPages"></span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 4l4 4-4 4"/></svg></summary>
            <ol class="check-list" id="checklistList"></ol>
          </details>

          <label class="field">
            <span class="field-label" data-i18n="checklistPasteLabel"></span>
            <textarea id="checklistPaste" rows="3" data-i18n-placeholder="checklistPastePlaceholder"></textarea>
          </label>
          <div class="row-buttons">
            <button type="button" class="btn btn-secondary btn-small" id="checklistAdd" data-i18n="btnAddPaths"></button>
            <button type="button" class="btn btn-secondary btn-small" id="checklistAddCurrent" data-i18n="btnAddCurrent"></button>
          </div>
          <div class="row-buttons row-export" id="checklistExport" hidden>
            <button type="button" class="btn btn-secondary btn-small" id="checklistCsv" data-i18n="btnExportCsv"></button>
            <button type="button" class="btn btn-secondary btn-small" id="checklistCopy" data-i18n="btnCopyText"></button>
            <button type="button" class="link-button link-danger" id="checklistClear" data-i18n="btnClearList"></button>
          </div>
          <p class="result-line" id="checklistResult" role="status" aria-live="polite"></p>
        </div>
      </section>

      <!-- Compare: pane sizes, overlay, CSS differences. -->
      <section class="panel" role="tabpanel" id="panel-compare" aria-labelledby="tab-compare" tabindex="0" hidden>
        <p class="empty-hint" data-need-pair-hint data-i18n="needPairHint"></p>

        <div class="group" id="sizesGroup" data-needs-pair>
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionPaneSizes"></h2>
            <p class="group-help" data-i18n="paneSizesHelp"></p>
          </div>
          <dl class="sizes">
            <div class="size"><dt data-i18n="colLeft"></dt><dd id="sizeLeft">–</dd></div>
            <div class="size"><dt data-i18n="colRight"></dt><dd id="sizeRight">–</dd></div>
          </dl>
          <div class="segmented" role="radiogroup" data-i18n-aria="presetSideLabel">
            <label class="segment"><input type="radio" name="presetSide" value="left" checked><span data-i18n="colLeft"></span></label>
            <label class="segment"><input type="radio" name="presetSide" value="right"><span data-i18n="colRight"></span></label>
          </div>
          <div class="presets" role="group" data-i18n-aria="presetGroupLabel">
            <button type="button" class="btn btn-secondary btn-small" data-preset="375">375</button>
            <button type="button" class="btn btn-secondary btn-small" data-preset="768">768</button>
            <button type="button" class="btn btn-secondary btn-small" data-preset="1024">1024</button>
            <button type="button" class="btn btn-secondary btn-small" data-preset="1280">1280</button>
            <button type="button" class="btn btn-secondary btn-small" data-preset="1440">1440</button>
          </div>
          <p class="result-line" id="presetResult" role="status" aria-live="polite"></p>
        </div>

        <div class="group" id="overlayGroup" data-needs-pair>
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionOverlay"></h2>
            <p class="group-help" data-i18n="overlayHelp"></p>
          </div>
          <div id="overlayPermission" hidden>
            <p class="group-help" data-i18n="overlayPermissionHelp"></p>
            <button type="button" class="btn btn-secondary btn-small" id="allowCapture" data-i18n="btnAllowCapture"></button>
          </div>
          <p class="empty-hint" id="overlayNeedSync" data-i18n="overlayNeedSync" hidden></p>
          <div class="options" id="overlayControls">
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="overlayShow"></span></span>
              <input id="overlayOn" type="checkbox" class="switch">
            </label>
            <div class="option">
              <span class="option-text"><span class="option-label" id="overlayOverLabel" data-i18n="overlayOver"></span></span>
              <div class="segmented segmented-inline" role="radiogroup" aria-labelledby="overlayOverLabel">
                <label class="segment"><input type="radio" name="overlaySide" value="left"><span data-i18n="colLeft"></span></label>
                <label class="segment"><input type="radio" name="overlaySide" value="right"><span data-i18n="colRight"></span></label>
              </div>
            </div>
            <label class="option">
              <span class="option-text"><span class="option-label"><span data-i18n="overlayOpacity"></span> <output id="overlayOpacityValue"></output></span></span>
              <input id="overlayOpacity" type="range" class="range" min="10" max="100" step="5">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="overlayDifference"></span>
                <span class="option-help" data-i18n="overlayDifferenceHelp"></span>
              </span>
              <input id="overlayDifference" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="overlaySwipe"></span>
                <span class="option-help" data-i18n="overlaySwipeHelp"></span>
              </span>
              <input id="overlaySwipe" type="checkbox" class="switch">
            </label>
          </div>
          <div class="row-buttons">
            <button type="button" class="btn btn-secondary btn-small" id="overlayRefresh" data-i18n="overlayRefresh"></button>
          </div>
          <p class="result-line" id="overlayResult" role="status" aria-live="polite"></p>
        </div>
      </section>

      <!-- Settings: defaults for new pairs and the on-page button. -->
      <section class="panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" tabindex="0" hidden>
        <div class="group">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionDefaults"></h2>
            <p class="group-help" data-i18n="sectionDefaultsHelp"></p>
          </div>
          <div class="options">
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optAlign"></span></span>
              <select id="defaultAlignMode" class="select">
                <option value="pixel" data-i18n="alignPixel"></option>
                <option value="element" data-i18n="alignElement"></option>
              </select>
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optNavigation"></span></span>
              <input id="defaultSyncNavigation" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optClicks"></span></span>
              <input id="defaultMirrorClicks" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optHover"></span></span>
              <input id="defaultMirrorHover" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optCursor"></span></span>
              <input id="defaultShowCursor" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optContainers"></span></span>
              <input id="defaultSyncContainers" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optZoom"></span></span>
              <input id="defaultSyncZoom" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optInput"></span></span>
              <input id="defaultSyncInput" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optWpAdminBar"></span></span>
              <input id="defaultHideWpAdminBar" type="checkbox" class="switch">
            </label>
          </div>
        </div>

        <div class="group">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionHistory"></h2>
          </div>
          <div class="options">
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optRememberPairs"></span>
                <span class="option-help" data-i18n="optRememberPairsHelp"></span>
              </span>
              <input id="rememberPairs" type="checkbox" class="switch">
            </label>
          </div>
          <button type="button" class="link-button link-danger-inline" id="clearHistory" data-i18n="btnClearHistory"></button>
          <p class="result-line" id="clearHistoryResult" role="status" aria-live="polite"></p>
        </div>

        <div class="group">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionButton"></h2>
          </div>
          <div class="options">
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optAlwaysShow"></span>
                <span class="option-help" data-i18n="optAlwaysShowHelp"></span>
              </span>
              <input id="alwaysShow" type="checkbox" class="switch">
            </label>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <button id="openShortcuts" type="button" class="link-button" data-i18n="footerShortcuts"></button>
      <span class="credit"><span data-i18n="footerMadeBy"></span> <a href="https://bijbijker.nl" target="_blank" rel="noopener noreferrer">BijBijker</a></span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
