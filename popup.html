<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitScreen Browser Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <img src="icons/icon32.png" alt="" class="logo">
      <div>
        <h1>SplitScreen Browser Sync</h1>
        <p id="statusText">Loading…</p>
      </div>
    </header>

    <section class="section">
      <h2>Settings</h2>

      <label class="toggle-row">
        <input id="alwaysShow" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>Always show button on split screen</span>
      </label>

      <button id="showCurrent" type="button" class="primary-button">
        Show button on current split screen
      </button>

      <p id="hint" class="hint" hidden></p>
    </section>

    <section class="section section-spaced">
      <h2>Rulers</h2>
      <button id="addRuler" type="button" class="primary-button">
        + Add ruler
      </button>
    </section>

    <section class="section section-spaced">
      <h2>Defaults for new sessions</h2>

      <label class="toggle-row">
        <input id="defaultHideWpAdminBar" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>Hide WordPress admin bar</span>
      </label>

      <label class="toggle-row">
        <input id="defaultSyncNavigation" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>Sync navigation</span>
      </label>

      <label class="toggle-row">
        <input id="defaultMirrorClicks" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>Mirror clicks</span>
      </label>

      <label class="toggle-row">
        <input id="defaultMirrorHover" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>Mirror hover effects</span>
      </label>

      <p class="hint">Applied to each new split screen pairing. Change the current split from its on-page panel.</p>
    </section>

    <footer id="footerMeta" class="footer-meta"></footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
