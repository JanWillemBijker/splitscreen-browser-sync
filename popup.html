<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitScreen Browser Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" data-state="loading">
    <header class="masthead">
      <img src="icons/icon32.png" alt="" class="masthead-logo" width="24" height="24">
      <h1 class="masthead-title" data-i18n="extName">SplitScreen Browser Sync</h1>
      <span class="masthead-version" id="version"></span>
    </header>

    <!-- Status of the active tab's Split View pair. Always visible. -->
    <section class="status" aria-labelledby="statusTitle">
      <div class="status-row">
        <svg class="pair" viewBox="0 0 76 44" aria-hidden="true" focusable="false">
          <rect class="pair-pane" x="1" y="1" width="30" height="42" rx="5"/>
          <rect class="pair-pane" x="45" y="1" width="30" height="42" rx="5"/>
          <g class="pair-lines">
            <rect x="6" y="8" width="16" height="3" rx="1.5"/>
            <rect x="6" y="15" width="20" height="3" rx="1.5"/>
            <rect x="6" y="22" width="12" height="3" rx="1.5"/>
            <rect x="50" y="8" width="16" height="3" rx="1.5"/>
            <rect x="50" y="15" width="20" height="3" rx="1.5"/>
            <rect x="50" y="22" width="12" height="3" rx="1.5"/>
          </g>
          <path class="pair-link" d="M31 22h14"/>
          <circle class="pair-node" cx="38" cy="22" r="4"/>
        </svg>
        <div class="status-text" role="status" aria-live="polite">
          <h2 class="status-title" id="statusTitle"></h2>
          <p class="status-body" id="statusBody"></p>
          <p class="status-meta" id="statusMeta" hidden></p>
        </div>
      </div>

      <button id="syncToggle" type="button" class="btn btn-primary" hidden></button>
    </section>

    <div class="tabs" role="tablist" data-i18n-aria="tabsLabel">
      <button type="button" class="tab" role="tab" id="tab-sync" aria-controls="panel-sync" data-tab="sync" data-i18n="tabSync"></button>
      <button type="button" class="tab" role="tab" id="tab-settings" aria-controls="panel-settings" data-tab="settings" data-i18n="tabSettings"></button>
    </div>

    <div class="panels">
      <!-- Sync: options for the current pair. -->
      <section class="panel" role="tabpanel" id="panel-sync" aria-labelledby="tab-sync" tabindex="0">
        <ol class="steps" id="emptySteps" hidden>
          <li data-i18n="emptyStep1"></li>
          <li data-i18n="emptyStep2"></li>
          <li data-i18n="emptyStep3"></li>
        </ol>

        <div class="group" id="currentGroup" hidden>
          <div class="group-head">
            <h2 class="group-title" id="currentGroupTitle" data-i18n="sectionThisSplit"></h2>
            <p class="group-help" data-i18n="sectionThisSplitHelp"></p>
          </div>

          <div class="options">
            <label class="option option-stack">
              <span class="option-text">
                <span class="option-label" data-i18n="optAlign"></span>
                <span class="option-help" data-i18n="optAlignHelp"></span>
              </span>
              <select class="select" data-group-choice="alignMode">
                <option value="pixel" data-i18n="alignPixel"></option>
                <option value="element" data-i18n="alignElement"></option>
              </select>
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optNavigation"></span>
                <span class="option-help" data-i18n="optNavigationHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="syncNavigation">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optClicks"></span>
                <span class="option-help" data-i18n="optClicksHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="mirrorClicks">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optHover"></span>
                <span class="option-help" data-i18n="optHoverHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="mirrorHover">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optCursor"></span>
                <span class="option-help" data-i18n="optCursorHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="showCursor">
            </label>
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optWpAdminBar"></span>
                <span class="option-help" data-i18n="optWpAdminBarHelp"></span>
              </span>
              <input type="checkbox" class="switch" data-group-option="hideWpAdminBar">
            </label>
          </div>

          <div class="actions">
            <button id="addRuler" type="button" class="btn btn-secondary">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 8h12M8 4v8" /></svg>
              <span data-i18n="btnAddRuler"></span>
            </button>
            <button id="showCurrent" type="button" class="btn btn-secondary"></button>
          </div>
        </div>
      </section>

      <!-- Settings: defaults for new pairs and the on-page button. -->
      <section class="panel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" tabindex="0" hidden>
        <div class="group">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionDefaults"></h2>
            <p class="group-help" data-i18n="sectionDefaultsHelp"></p>
          </div>
          <div class="options">
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optAlign"></span></span>
              <select id="defaultAlignMode" class="select">
                <option value="pixel" data-i18n="alignPixel"></option>
                <option value="element" data-i18n="alignElement"></option>
              </select>
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optNavigation"></span></span>
              <input id="defaultSyncNavigation" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optClicks"></span></span>
              <input id="defaultMirrorClicks" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optHover"></span></span>
              <input id="defaultMirrorHover" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optCursor"></span></span>
              <input id="defaultShowCursor" type="checkbox" class="switch">
            </label>
            <label class="option">
              <span class="option-text"><span class="option-label" data-i18n="optWpAdminBar"></span></span>
              <input id="defaultHideWpAdminBar" type="checkbox" class="switch">
            </label>
          </div>
        </div>

        <div class="group">
          <div class="group-head">
            <h2 class="group-title" data-i18n="sectionButton"></h2>
          </div>
          <div class="options">
            <label class="option">
              <span class="option-text">
                <span class="option-label" data-i18n="optAlwaysShow"></span>
                <span class="option-help" data-i18n="optAlwaysShowHelp"></span>
              </span>
              <input id="alwaysShow" type="checkbox" class="switch">
            </label>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <button id="openShortcuts" type="button" class="link-button" data-i18n="footerShortcuts"></button>
      <span class="credit"><span data-i18n="footerMadeBy"></span> <a href="https://bijbijker.nl" target="_blank" rel="noopener noreferrer">BijBijker</a></span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
